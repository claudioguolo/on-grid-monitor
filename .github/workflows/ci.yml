name: PHP MySQL
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up -d --build
      - run: docker compose exec -T app php spark migrate --all
      - run: docker compose run --rm --no-deps -v "$PWD/tests:/var/www/html/tests:ro" app php tests/energy_check.php
      - run: docker compose exec -T app php -r 'if (json_decode(file_get_contents("http://localhost/health"),true)["ok"] !== true) exit(1);'
      - if: always()
        run: docker compose down -v
