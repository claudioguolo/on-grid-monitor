name: coletor_energia_php
services:
  app:
    build: .
    ports:
      - "8081:80"
    environment:
      CI_ENVIRONMENT: development
      APP_BASE_URL: http://localhost:8081/
      DB_HOST: db
      DB_NAME: energia
      DB_USER: energia
      DB_PASSWORD: ${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD no .env}
      DB_DRIVER: MySQLi
      DB_PORT: 3306
    volumes:
      - ./config/software.json:/var/www/html/config/software.json:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: energia
      MYSQL_USER: energia
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD no .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD no .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
volumes:
  mysql_data:
