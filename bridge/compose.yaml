name: py9mt-energy-bridge
services:
  bridge:
    build: .
    ports:
      - "8080:8080"
    env_file: .env
    volumes:
      - cache:/data
    restart: always
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
volumes:
  cache:
